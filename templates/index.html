<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible OCR Web App v1.0</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<h1>Accessible OCR Web App</h1>

<p>Upload an image or scanned PDF to extract text.</p>

<form action="/upload" method="POST" enctype="multipart/form-data" onsubmit="document.getElementById('statusMsg').innerText='Running OCR...';document.getElementById('extractBtn').disabled=true;return true;">

    <label for="fileUpload">
        Choose an image or PDF:
    </label>

    <br><br>

    <input
        id="fileUpload"
        name="file"
        type="file"
        accept=".png,.jpg,.jpeg,.bmp,.tiff,.pdf">

    
<label for="language">Language:</label><br><br>
<select id="language" name="language" onchange="document.getElementById('otherLanguage').style.display=this.value=='other'?'block':'none';">
<option value="auto" {% if selected_language=="auto" %}selected{% endif %}>Automatic</option>
<option value="eng" {% if selected_language=="eng" %}selected{% endif %}>English</option>
<option value="mal" {% if selected_language=="mal" %}selected{% endif %}>Malayalam</option>
<option value="tam" {% if selected_language=="tam" %}selected{% endif %}>Tamil</option>
<option value="hin" {% if selected_language=="hin" %}selected{% endif %}>Hindi</option>
<option value="kan" {% if selected_language=="kan" %}selected{% endif %}>Kannada</option>
<option value="tel" {% if selected_language=="tel" %}selected{% endif %}>Telugu</option>
<option value="other" {% if selected_language=="other" %}selected{% endif %}>Other...</option>
</select>
<div id="otherLanguage" style="display:{% if selected_language=='other' %}block{% else %}none{% endif %};">
<label for="other_language">Tesseract language code:</label><br>
<input id="other_language" name="other_language" value="{{ other_language }}">
</div><br><br>

<label for="pageSelection">Pages to OCR (PDF only):</label>
<br><br>

<input
    id="pageSelection"
    name="pageSelection"
    type="text"
    value="All"
    placeholder="Examples: All, 3, 1-3, 2,5,8">

<br><br>
<button id="extractBtn" type="submit">Extract Text</button>

</form>

<hr>

<h2>Status</h2>

<p id="statusMsg" aria-live="polite">
{{ status }}
</p>

<hr>

<h2>Extracted Text</h2>

<textarea
rows="20"
cols="80"
readonly>{{ extracted_text }}</textarea>

<div id="actions" {% if not extracted_text %}style="display:none"{% endif %}>
<button type="button" onclick="copyResult()">Copy Result</button>
<button type="button" onclick="downloadTxt()">Download TXT</button>
<button type="button" onclick="downloadDocx()">Download DOCX</button>
</div>

<p id="copyMsg" aria-live="polite"></p>

<p>Accessible OCR Web App – Version 1.0</p>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
